[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-calc-mcp"
version = "0.2.1"
description = "Business, financial, and tax calculator — MCP server + CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30.0,<2.0.0",
    # Security floors also apply to pip/uvx installs, which do not use uv.lock.
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[project.scripts]
finance-calc-mcp = "finance_calc_mcp.server:main"

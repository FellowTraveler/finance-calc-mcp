name: Tests and dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv export --locked --no-dev --no-emit-project -o requirements-audit.txt
      - run: uvx --python '${{ matrix.python }}' pip-audit -r requirements-audit.txt --no-deps --disable-pip
      - run: uv build

